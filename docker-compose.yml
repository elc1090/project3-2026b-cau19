# Banco PostgreSQL local para desenvolvimento.
# Substitui o comando "docker run ..." comprido: basta rodar  docker compose up -d
services:
  db:
    image: postgres:16
    container_name: dino-postgres        # mesmo nome usado nos comandos do ESTUDO.md
    environment:
      POSTGRES_USER: dino
      POSTGRES_PASSWORD: dino123
      POSTGRES_DB: dinogame
    ports:
      - "5432:5432"                      # porta do meu PC : porta do container
    volumes:
      - dino-data:/var/lib/postgresql/data              # guarda os dados mesmo se o container for recriado
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro   # roda o schema na 1a vez que o banco e criado

volumes:
  dino-data:
